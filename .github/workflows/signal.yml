name: SIGNAL daily report

on:
  schedule:
    # GitHub delays jobs scheduled on the hour by hours; odd minutes run close to on time.
    - cron: "17 10 * * *"   # ~5:17 AM ET: last night's games are final -> morning tally + today's slate
    - cron: "43 19 * * *"   # ~2:43 PM ET: refresh injury report and posted lines before tip-off
  workflow_dispatch:
    inputs:
      nba_from:
        description: "NBA backfill start (YYYY-MM-DD). Blank = season start / only missing days"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: signal-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build and push team report (MLB / NBA / WNBA)
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: a7ebd591bd69d8a1bd777a60ab7ce089
        run: python build_signal.py

      - name: NBA tracker - team + player game logs and O/U hit rates
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}   # optional; unset = player prop lines are simply not fetched
          GIST_ID: a7ebd591bd69d8a1bd777a60ab7ce089
        run: |
          if [ -n "${{ github.event.inputs.nba_from }}" ]; then
            python nba_tracker.py --from "${{ github.event.inputs.nba_from }}" --backfill-lines
          else
            python nba_tracker.py --backfill-lines
          fi

      - name: Rebuild context summaries (context/ - read by Claude project sessions)
        run: python tools/build_context.py

      - name: Commit NBA data back to repo (keeps backfill state)
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add data/nba nba_player_props.md data/nba/lines context
          git diff --cached --quiet && echo "no data changes" && exit 0
          git commit -m "nba: data through $(date -u +%F)"
          # the Desktop scheduled task may have pushed the same day's data; replay on top, keep our files
          git pull --rebase -X theirs origin main || true
          git push
